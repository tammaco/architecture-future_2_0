name: Terraform CI/CD

on:
  push:
    branches: [ "architecture-future_2_0" ]
  workflow_dispatch:
  pull_request:
    branches: [ "architecture-future_2_0" ]

jobs:
  plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Init
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            hashicorp/terraform:1.9.8 \
            sh -c "cd ./Task2Advanced/infra && terraform init"

      - name: Terraform Plan
        id: plan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            hashicorp/terraform:1.9.8 \
            sh -c "cd ./Task2Advanced/infra && terraform plan -out=tfplan"
        continue-on-error: true

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ./Task2Advanced/infra/tfplan

  apply:
    name: 'Terraform Apply (Manual Approval)'
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/architecture-future_2_0'
    environment: production
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ./Task2Advanced/infra

      - name: Terraform Apply
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            hashicorp/terraform:1.9.8 \
            sh -c "cd ./Task2Advanced/infra && terraform apply tfplan"