name: Terraform CI/CD

on:
  push:
    branches: [ "architecture-future_2_0" ]
  workflow_dispatch:
  pull_request:
    branches: [ "architecture-future_2_0" ]

jobs:
  terraform:
    name: 'Terraform Apply (with Manual Approval)'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Init
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/Task2Advanced/infra \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e TF_VAR_yandex_folder_id=${{ secrets.TF_VAR_yandex_folder_id }} \
            -e TF_VAR_subnet_id=${{ secrets.TF_VAR_subnet_id }} \
            -e TF_VAR_service_account_key_file=${{ secrets.TF_VAR_service_account_key_file }} \
            hashicorp/terraform:1.9.8 \
            init -var-file="terraform.tfvars.public"

      - name: Terraform Plan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/Task2Advanced/infra \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e TF_VAR_yandex_folder_id=${{ secrets.TF_VAR_yandex_folder_id }} \
            -e TF_VAR_subnet_id=${{ secrets.TF_VAR_subnet_id }} \
            -e TF_VAR_service_account_key_file=${{ secrets.TF_VAR_service_account_key_file }} \
            hashicorp/terraform:1.9.8 \
            plan -var-file="terraform.tfvars.public"

      - name: Terraform Apply
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/Task2Advanced/infra \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e TF_VAR_yandex_folder_id=${{ secrets.TF_VAR_yandex_folder_id }} \
            -e TF_VAR_subnet_id=${{ secrets.TF_VAR_subnet_id }} \
            -e TF_VAR_service_account_key_file=${{ secrets.TF_VAR_service_account_key_file }} \
            hashicorp/terraform:1.9.8 \
            apply -auto-approve -var-file="terraform.tfvars.public"