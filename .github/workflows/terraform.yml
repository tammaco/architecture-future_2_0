name: Terraform CI/CD

on:
  push:
    branches: [ "architecture-future_2_0" ]
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_subnet_id: ${{ secrets.TF_VAR_subnet_id }}
      TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_ssh_public_key }}
      TF_VAR_yandex_cloud_id: ${{ secrets.YC_CLOUD_ID }}
      TF_VAR_yandex_folder_id: ${{ secrets.YC_FOLDER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create key.json
        run: |
          mkdir -p Task2Advanced/infra
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_FILE_CONTENT }}' > Task2Advanced/infra/key.json

      - name: Terraform Init
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/Task2Advanced/infra \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_EC2_METADATA_DISABLED \
            -e TF_VAR_subnet_id \
            -e TF_VAR_ssh_public_key \
            -e TF_VAR_yandex_cloud_id \
            -e TF_VAR_yandex_folder_id \
            -e TF_VAR_service_account_key_file_path=key.json \
            hashicorp/terraform:1.9.8 \
            init

      - name: Terraform Plan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/Task2Advanced/infra \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_EC2_METADATA_DISABLED \
            -e TF_VAR_subnet_id \
            -e TF_VAR_ssh_public_key \
            -e TF_VAR_yandex_cloud_id \
            -e TF_VAR_yandex_folder_id \
            -e TF_VAR_service_account_key_file_path=key.json \
            hashicorp/terraform:1.9.8 \
            plan

      - name: Terraform Apply
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/Task2Advanced/infra \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_EC2_METADATA_DISABLED \
            -e TF_VAR_subnet_id \
            -e TF_VAR_ssh_public_key \
            -e TF_VAR_yandex_cloud_id \
            -e TF_VAR_yandex_folder_id \
            -e TF_VAR_service_account_key_file_path=key.json \
            hashicorp/terraform:1.9.8 \
            apply -auto-approve