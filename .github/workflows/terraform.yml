name: Terraform CI/CD

on:
  push:
    branches: [ "architecture-future_2_0" ]
  workflow_dispatch:
  pull_request:
    branches: [ "architecture-future_2_0" ]

jobs:
  terraform:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      YC_SERVICE_ACCOUNT_KEY_FILE: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_FILE_CONTENT }}
      YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_subnet_id: ${{ secrets.TF_VAR_subnet_id }}
      TF_VAR_ssh_public_key_path: ${{ secrets.TF_VAR_ssh_public_key_path }}
      TF_VAR_zone: ${{ secrets.TF_VAR_zone }}
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Init
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/Task2Advanced/infra \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_EC2_METADATA_DISABLED \
            -e YC_SERVICE_ACCOUNT_KEY_FILE \
            -e YC_CLOUD_ID \
            -e YC_FOLDER_ID \
            -e TF_VAR_subnet_id \
            -e TF_VAR_ssh_public_key_path \
            -e TF_VAR_zone \
            hashicorp/terraform:1.9.8 \
            init

      - name: Terraform Plan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/Task2Advanced/infra \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_EC2_METADATA_DISABLED \
            -e YC_SERVICE_ACCOUNT_KEY_FILE \
            -e YC_CLOUD_ID \
            -e YC_FOLDER_ID \
            -e TF_VAR_subnet_id \
            -e TF_VAR_ssh_public_key_path \
            -e TF_VAR_zone \
            hashicorp/terraform:1.9.8 \
            plan

      - name: Terraform Apply
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/Task2Advanced/infra \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_EC2_METADATA_DISABLED \
            -e YC_SERVICE_ACCOUNT_KEY_FILE \
            -e YC_CLOUD_ID \
            -e YC_FOLDER_ID \
            -e TF_VAR_subnet_id \
            -e TF_VAR_ssh_public_key_path \
            -e TF_VAR_zone \
            hashicorp/terraform:1.9.8 \
            apply -auto-approve