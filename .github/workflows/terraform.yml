name: Terraform CI/CD

on:
  push:
    branches: [ "architecture-future_2_0" ]
  workflow_dispatch:
  pull_request:
    branches: [ "architecture-future_2_0" ]

jobs:
  terraform:
    name: 'Terraform Apply (with Manual Approval)'
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_VAR_yandex_access_key: ${{ secrets.TF_VAR_yandex_access_key }}
      TF_VAR_yandex_secret_key: ${{ secrets.TF_VAR_yandex_secret_key }}
      TF_VAR_yandex_folder_id: ${{ secrets.TF_VAR_yandex_folder_id }}
      TF_VAR_subnet_id: ${{ secrets.TF_VAR_subnet_id }}
      TF_VAR_service_account_key_file: ${{ secrets.TF_VAR_service_account_key_file }}
      TF_VAR_ssh_public_key_path: ${{ secrets.TF_VAR_ssh_public_key_path }}
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Init
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/Task2Advanced/infra \
            hashicorp/terraform:1.9.8 \
            init -var-file="terraform.tfvars.public"

      - name: Terraform Plan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/Task2Advanced/infra \
            hashicorp/terraform:1.9.8 \
            plan -var-file="terraform.tfvars.public"

      - name: Terraform Apply
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/Task2Advanced/infra \
            hashicorp/terraform:1.9.8 \
            apply -auto-approve -var-file="terraform.tfvars.public"