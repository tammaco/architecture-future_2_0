name: Terraform CI/CD

on:
  push:
    branches: [ "architecture-future_2_0" ]
  workflow_dispatch:
  pull_request:
    branches: [ "architecture-future_2_0" ]

jobs:
  plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -chdir=./Task2Advanced/infra

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -chdir=./Task2Advanced/infra -out=tfplan
        continue-on-error: true

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ./Task2Advanced/infra/tfplan

  apply:
    name: 'Terraform Apply (Manual Approval)'
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/architecture-future_2_0'
    environment: production
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ./Task2Advanced/infra

      - name: Terraform Apply
        run: terraform apply -chdir=./Task2Advanced/infra tfplan